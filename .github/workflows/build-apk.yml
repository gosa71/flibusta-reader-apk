name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.5.3'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Gradle wrapper
        run: |
          cd android
          if [ ! -f gradlew ]; then
            echo "Generating gradle wrapper..."
            # Use Flutter's embedded gradle or download wrapper
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v6.7.1/gradle/wrapper/gradle-wrapper.jar || true
            cat > gradlew << 'EOF'
#!/usr/bin/env sh
# Gradle start up script for POSIX generated minimal
DIR="$(cd "$(dirname "$0")" && pwd)"
exec java -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
EOF
            chmod +x gradlew
          fi
          ls -la
          ls -la gradle/wrapper/ || true

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug -v 2>&1 | tee build_full.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build_full.log
            android/.gradle/**/*.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flibusta-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: |
          echo "=== BUILD FAILED - last 80 lines of log ==="
          tail -80 build_full.log || true
          exit 1

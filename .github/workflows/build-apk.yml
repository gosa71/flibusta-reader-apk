name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.5.3'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Bootstrap Gradle wrapper
        run: |
          set -e
          cd android
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v6.7.1/gradle/wrapper/gradle-wrapper.jar"
          fi
          if [ ! -f gradlew ]; then
            echo "Creating gradlew..."
            printf '%s\n' \
              '#!/usr/bin/env sh' \
              'DIR="$(cd "$(dirname "$0")" && pwd)"' \
              'exec java -classpath "$DIR/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' \
              > gradlew
            chmod +x gradlew
          fi
          ls -la
          ls -la gradle/wrapper/

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build_full.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_full.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: flibusta-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Show errors as annotations and fail
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::flutter build apk --debug FAILED"
          # Extract the most useful error lines
          if [ -f build_full.log ]; then
            # Print last 60 lines as errors (GitHub shows them in annotations)
            tail -60 build_full.log | while IFS= read -r line; do
              # skip pure progress noise
              case "$line" in
                *"Resolving dependencies"*|*"> Task"*|*"> Configure"*) continue ;;
              esac
              echo "::error::$line"
            done
            # Also dump grep for common error markers
            echo "::group::Error markers"
            grep -nE 'error:|Error:|FAILURE:|Exception|What went wrong|BUILD FAILED|A problem occurred' build_full.log | tail -40 || true
            echo "::endgroup::"
          else
            echo "::error::build_full.log missing"
          fi
          exit 1
